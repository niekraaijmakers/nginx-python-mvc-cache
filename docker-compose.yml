services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  python-app:
    build: ./python-app
    environment:
      - REDIS_URL=redis://redis:6379
      - CACHE_TTL_SECONDS=15
    depends_on:
      - redis
    ports:
      - "4000:3000" # exposed directly too, so you can compare with/without NGINX

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - python-app
    ports:
      - "8080:80"
