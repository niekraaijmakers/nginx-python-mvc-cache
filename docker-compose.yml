services:
  python-app:
    build: ./python-app
    environment:
      - DB_PATH=/data/app.db
    volumes:
      # Bind-mount the real database file to the host so interns can
      # inspect it directly (e.g. with `sqlite3` or a GUI browser) without
      # touching Docker.
      - ./python-app/data:/data
      # Bind-mount the app source over what was baked into the image, so
      # edits on the host take effect live - paired with uvicorn's
      # --reload in the Dockerfile, no `docker compose up --build` needed
      # for Python/template/static changes.
      - ./python-app/app:/usr/src/app/app
    ports:
      - "4000:3000" # exposed directly too, so you can compare with/without NGINX

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Bind-mount the cache dir to the host so interns can browse the
      # actual cached files in a normal file explorer/terminal - no need
      # to know `docker exec` or anything else Docker-specific.
      - ./nginx/cache:/var/cache/nginx
    depends_on:
      - python-app
    ports:
      - "8080:80"
