# Reverse proxy + HTTP cache in front of the Python MVC app.
#
# This is the ONLY cache in the whole system:
#   client -> NGINX (this file, proxy_cache) -> FastAPI app -> SQLite (real DB)
#
# What's cached here is deliberately NOT a JSON API response - it's the
# server-rendered HTML page itself (GET /, which includes the live item
# list) plus its static assets (/static/style.css, /static/app.js). This
# is the more realistic, "old school but still very common" shape of web
# caching: cache full pages and static files, not API payloads.
#
# The key lesson on THIS branch (demo/cache-busting): GET / is cacheable
# with a generous 2-minute TTL, but POST /items *actively busts* the
# cached page by deleting its file straight off disk (see
# python-app/app/models/cache_buster.py) - NGINX itself has no PURGE
# support built in (that normally needs the third-party ngx_cache_purge
# module, an OpenResty/Lua endpoint, or a CDN purge API), so this is a
# deliberately low-tech stand-in: the app and NGINX share the same
# on-disk cache directory (see docker-compose.yml), so the app can just
# know the cache's naming scheme and delete the right file.
#
# Compare with `demo/stale-content` (no purge at all, TTL-only) to see
# both ends of the trade-off.
#
# Try:
#   curl -i http://localhost:8080/                          (repeat -> MISS then HIT)
#   curl -i -X POST http://localhost:8080/items \
#        -H 'Content-Type: application/x-www-form-urlencoded' -d 'name=widget'
#   -> the very next GET is a MISS again (not a stale HIT!) even though
#      the 2-minute TTL hasn't elapsed - the POST purged it.
#
# Or skip curl entirely and open http://localhost:8080/ in a browser.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Two separate cache zones/dirs, both under the same bind-mounted root
  # (see docker-compose.yml -> ./nginx/cache:/var/cache/nginx) so both are
  # inspectable on the host without Docker:
  #
  # - PAGE_CACHE: the rendered HTML page. Short-ish TTL, because it shows
  #   live data (the item list).
  # - STATIC_CACHE: CSS/JS. Much longer TTL, because static assets change
  #   far less often than "the current list of items" - a realistic
  #   split you'll see in almost every real caching setup.
  proxy_cache_path /var/cache/nginx/pages levels=1:2 keys_zone=PAGE_CACHE:10m max_size=100m inactive=10m use_temp_path=off;
  proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=STATIC_CACHE:10m max_size=100m inactive=60m use_temp_path=off;

  server {
    listen 80;

    add_header X-Cache-Status $upstream_cache_status always;

    location = / {
      proxy_pass http://python-app:3000;
      proxy_http_version 1.1;

      # Only GET/HEAD are ever read from or written to the cache. A POST
      # would never land here anyway (it goes to /items below), but this
      # is spelled out explicitly so it's obvious to interns reading this
      # file that caching a page is opt-in per verb, not just per path.
      # On this branch the app *additionally* purges this cache file
      # after a successful POST - see cache_buster.py - so the TTL below
      # almost never gets a chance to matter in practice.
      proxy_cache PAGE_CACHE;
      proxy_cache_methods GET HEAD;
      # This TTL is the single source of truth for how long the page
      # stays cached *if nothing ever purges it*. Deliberately left at a
      # generous 2 minutes on this branch specifically to prove the
      # point: even with a long TTL, an active purge makes writes visible
      # immediately, which is the opposite lesson of `demo/stale-content`.
      proxy_cache_valid 200 120s;
      proxy_cache_key "$scheme$request_method$host$request_uri";
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
    }

    location /items {
      # Item creation (POST). Never cached - this is a write.
      proxy_pass http://python-app:3000;
      proxy_http_version 1.1;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    location /static/ {
      proxy_pass http://python-app:3000;
      proxy_http_version 1.1;
      proxy_cache STATIC_CACHE;
      proxy_cache_methods GET HEAD;
      proxy_cache_valid 200 1d;
      proxy_cache_key "$scheme$request_method$host$request_uri";
      # NGINX quirk: once a location defines its own add_header, it stops
      # inheriting add_header directives from the server block above -
      # so X-Cache-Status has to be repeated here too, or it silently
      # disappears just for this location.
      add_header X-Cache-Status $upstream_cache_status always;
      add_header Cache-Control "public, max-age=86400";
    }

    location /healthz {
      proxy_pass http://python-app:3000;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # Swagger UI / ReDoc / OpenAPI schema - still available for interns who
    # want to peek at the raw route/schema definitions. Never cached:
    # it's tooling, not data.
    location ~ ^/(docs|redoc|openapi\.json) {
      proxy_pass http://python-app:3000;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }
  }
}
