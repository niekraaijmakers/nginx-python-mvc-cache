# Reverse proxy + HTTP cache in front of the Python MVC app.
#
# This is the ONLY cache in the whole system:
#   client -> NGINX (this file, proxy_cache) -> FastAPI app -> SQLite (real DB)
#
# The key lesson on THIS branch (demo/cache-busting): GET /api/items is
# cacheable with a generous 2-minute TTL, but POST /api/items *actively
# busts* that cached entry by deleting its file straight off disk (see
# python-app/app/models/cache_buster.py) - NGINX itself has no PURGE
# support built in (that normally needs the third-party ngx_cache_purge
# module, an OpenResty/Lua endpoint, or a CDN purge API), so this is a
# deliberately low-tech stand-in: the app and NGINX share the same
# on-disk cache directory (see docker-compose.yml), so the app can just
# know the cache's naming scheme and delete the right file.
#
# Compare with `demo/stale-content` (no purge at all, TTL-only) to see
# both ends of the trade-off.
#
# Try:
#   curl -i http://localhost:8080/api/items                (repeat -> MISS then HIT)
#   curl -i -X POST http://localhost:8080/api/items \
#        -H 'Content-Type: application/json' -d '{"name":"widget"}'
#   -> the very next GET is a MISS again (not a stale HIT!) even though
#      the 2-minute TTL hasn't elapsed - the POST purged it.
#
# Or skip curl entirely and use the Swagger UI at http://localhost:8080/docs

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Cache storage on disk: 10MB keys zone "APP_CACHE", cap total cache at 100MB,
  # inactive entries removed after 10m of no access.
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=APP_CACHE:10m max_size=100m inactive=10m use_temp_path=off;

  server {
    listen 80;

    add_header X-Cache-Status $upstream_cache_status always;

    location /api/items {
      proxy_pass http://python-app:3000;
      proxy_http_version 1.1;

      # Only GET/HEAD are ever read from or written to the cache. A POST
      # here is always proxied straight through to the app and never
      # touches the cache - this is NGINX's default, spelled out
      # explicitly so it's obvious to interns reading this file. On this
      # branch the app *additionally* purges the GET cache file after a
      # successful POST - see cache_buster.py - so the TTL below almost
      # never gets a chance to matter in practice.
      proxy_cache APP_CACHE;
      proxy_cache_methods GET HEAD;
      # This TTL is the single source of truth for how long a response
      # stays cached *if nothing ever purges it*. Deliberately left at a
      # generous 2 minutes on this branch specifically to prove the point:
      # even with a long TTL, an active purge makes writes visible
      # immediately, which is the opposite lesson of `demo/stale-content`.
      proxy_cache_valid 200 120s;
      proxy_cache_key "$scheme$request_method$host$request_uri";
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
    }

    location /healthz {
      proxy_pass http://python-app:3000;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # Swagger UI / ReDoc / OpenAPI schema - the interactive "easy UI" for
    # exercising the API. Never cached: it's tooling, not data.
    location ~ ^/(docs|redoc|openapi\.json) {
      proxy_pass http://python-app:3000;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }
  }
}
